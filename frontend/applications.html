<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Tracker - UniGuide AI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-custom">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="index.html">
                <i data-lucide="graduation-cap"></i> UniGuide <span>AI</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i data-lucide="menu"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html"><i data-lucide="home"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="colleges.html"><i data-lucide="building-2"></i> Colleges</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="prediction.html"><i data-lucide="target"></i> Predictor</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="recommendations.html"><i data-lucide="sparkles"></i> AI Recs</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom active" href="applications.html"><i data-lucide="check-square"></i> Tracker</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <button class="dark-mode-toggle me-2" title="Toggle Dark Mode">
                        <i data-lucide="moon"></i>
                    </button>
                    <div id="navAuthSection" class="d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">Login</a>
                        <a href="register.html" class="btn btn-primary btn-sm rounded-pill px-3">Get Started</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container section-padding">
        
        <div class="d-flex justify-content-between align-items-center mb-5 fade-in">
            <div>
                <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill fw-bold mb-2">LIVE TRACKING</span>
                <h2 class="display-6 fw-extrabold text-primary mb-1">Admission Application Tracker</h2>
                <p class="text-muted mb-0">Track application dates, counseling deadlines, and review statuses across your target colleges.</p>
            </div>
            <button class="btn btn-primary px-4 py-2 fw-bold" id="openAddAppModalBtn">
                <i data-lucide="plus" class="me-1"></i> Add Application
            </button>
        </div>

        <!-- Application Cards Grid -->
        <div class="row g-4 fade-in" id="applicationsGridContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Fetching your applications...</p>
            </div>
        </div>

    </div>

    <!-- Application Modal -->
    <div class="modal fade" id="applicationModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="appModalTitle">Track New Admission Application</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="applicationForm">
                    <input type="hidden" id="appId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">College Name</label>
                            <input type="text" class="form-control" id="appCollegeName" placeholder="e.g. Chandigarh University" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Course Name</label>
                                <input type="text" class="form-control" id="appCourseName" placeholder="e.g. MCA" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Application Status</label>
                                <select class="form-select" id="appStatus">
                                    <option value="Not Applied">Not Applied</option>
                                    <option value="Planning">Planning</option>
                                    <option value="Applied">Applied</option>
                                    <option value="Under Review">Under Review</option>
                                    <option value="Accepted">Accepted</option>
                                    <option value="Rejected">Rejected</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Application Date</label>
                                <input type="date" class="form-control" id="appDate">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Registration Deadline</label>
                                <input type="date" class="form-control" id="appDeadline">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Notes / Checklist Reminders</label>
                            <textarea class="form-control" id="appNotes" rows="3" placeholder="e.g. Submitted application fee online. Awaiting document verification."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveAppBtn">Save Entry</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/applications.js"></script>
</body>
</html>
