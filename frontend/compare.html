<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Comparison - UniGuide AI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-custom">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="index.html">
                <i data-lucide="graduation-cap"></i> UniGuide <span>AI</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i data-lucide="menu"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html"><i data-lucide="home"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="colleges.html"><i data-lucide="building-2"></i> Colleges</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="prediction.html"><i data-lucide="target"></i> Predictor</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="recommendations.html"><i data-lucide="sparkles"></i> AI Recs</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom active" href="compare.html"><i data-lucide="git-compare"></i> Compare</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <button class="dark-mode-toggle me-2" title="Toggle Dark Mode">
                        <i data-lucide="moon"></i>
                    </button>
                    <div id="navAuthSection" class="d-flex align-items-center gap-2">
                        <a href="login.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">Login</a>
                        <a href="register.html" class="btn btn-primary btn-sm rounded-pill px-3">Get Started</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container section-padding">
        
        <div class="text-center max-w-700 mx-auto mb-5 fade-in">
            <span class="badge bg-info-subtle text-info px-3 py-2 rounded-pill fw-bold mb-2">SIDE-BY-SIDE MATRIX</span>
            <h2 class="display-6 fw-extrabold text-primary">College Comparison</h2>
            <p class="text-muted">Compare fees, cutoffs, placements, and eligibility metrics across top target institutions.</p>
        </div>

        <!-- Selector Row -->
        <div class="card-custom p-4 mb-5 fade-in">
            <h6 class="fw-bold mb-3"><i data-lucide="sliders" class="me-1 text-primary"></i> Select 2 to 3 Colleges to Compare</h6>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label small fw-bold">College 1</label>
                    <select class="form-select college-select-box" id="compareCollege1"></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">College 2</label>
                    <select class="form-select college-select-box" id="compareCollege2"></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">College 3 (Optional)</label>
                    <select class="form-select college-select-box" id="compareCollege3"></select>
                </div>
            </div>
        </div>

        <!-- Desktop Comparison Matrix Table -->
        <div class="table-responsive d-none d-md-block fade-in mb-5">
            <table class="table table-bordered table-striped align-middle bg-surface shadow-sm rounded-3 overflow-hidden" id="comparisonTable">
                <thead class="bg-gradient-primary text-white">
                    <tr id="compareTableHeader">
                        <th style="width: 20%;">Metric / Feature</th>
                        <!-- College Columns rendered dynamically -->
                    </tr>
                </thead>
                <tbody id="compareTableBody">
                    <!-- Comparison Rows -->
                </tbody>
            </table>
        </div>

        <!-- Mobile Stacked Cards Container -->
        <div class="d-md-none d-flex flex-column gap-4 fade-in" id="mobileCompareContainer">
            <!-- Mobile stacked cards rendered dynamically -->
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/compare.js"></script>
</body>
</html>
