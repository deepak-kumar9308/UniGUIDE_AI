<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniGuide AI</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #172554 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            position: relative;
            z-index: 10;
        }

        .brand-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.85rem;
            color: #172554;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo span {
            color: #2563eb;
        }

        .form-label {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
            margin-bottom: 0.4rem;
        }

        .form-control {
            border: 1.5px solid #cbd5e1;
            border-radius: 0.6rem;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: #0f172a;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            outline: none;
        }

        .btn-login {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 0.6rem;
            padding: 0.85rem;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 38px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0;
        }

        .password-toggle-btn:hover {
            color: #1e293b;
        }

        .form-error {
            color: #ef4444;
            font-size: 0.825rem;
            margin-top: 0.35rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <a href="index.html" class="brand-logo mb-2">
                <i data-lucide="graduation-cap" style="width: 32px; height: 32px; color: #2563eb;"></i>
                UniGuide <span>AI</span>
            </a>
            <h3 class="fw-bold text-dark mt-2 mb-1" style="font-family: 'Outfit', sans-serif;">Welcome Back</h3>
            <p class="text-muted small mb-0">Sign in to access your student dashboard & AI recommendations</p>
        </div>

        <!-- Form -->
        <form id="loginForm" novalidate>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="student@example.com" required>
                <div class="form-error"></div>
            </div>
            
            <div class="mb-3 position-relative">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                <button type="button" class="password-toggle-btn password-toggle" tabindex="-1">
                    <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                </button>
                <div class="form-error"></div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check d-flex align-items-center gap-2">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="#" class="text-primary fw-semibold text-decoration-none small">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-login mb-4">Sign In</button>
            
            <div class="text-center text-muted small">
                Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none">Create Account</a>
            </div>
            
        </form>
        
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
