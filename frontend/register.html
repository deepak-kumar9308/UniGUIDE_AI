<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UniGuide AI</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #172554 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: 'Inter', sans-serif;
        }

        .register-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 600px;
            padding: 2.5rem 2rem;
            position: relative;
            z-index: 10;
        }

        .brand-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.85rem;
            color: #172554;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo span {
            color: #2563eb;
        }

        .form-label {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            border: 1.5px solid #cbd5e1;
            border-radius: 0.6rem;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            color: #0f172a;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            outline: none;
        }

        .btn-register {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 0.6rem;
            padding: 0.85rem;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 38px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0;
        }

        .password-toggle-btn:hover {
            color: #1e293b;
        }

        .form-error {
            color: #ef4444;
            font-size: 0.825rem;
            margin-top: 0.35rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="register-card">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <a href="index.html" class="brand-logo mb-2">
                <i data-lucide="graduation-cap" style="width: 32px; height: 32px; color: #2563eb;"></i>
                UniGuide <span>AI</span>
            </a>
            <h3 class="fw-bold text-dark mt-2 mb-1" style="font-family: 'Outfit', sans-serif;">Create Student Account</h3>
            <p class="text-muted small mb-0">Fill in your details to get personalized college recommendations</p>
        </div>

        <!-- Form -->
        <form id="registerForm" novalidate>
            
            <div class="row g-3">
                <div class="col-md-6 mb-2">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                    <div class="form-error"></div>
                </div>
                
                <div class="col-md-6 mb-2">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="student@example.com" required>
                    <div class="form-error"></div>
                </div>

                <div class="col-md-6 mb-2 position-relative">
                    <label for="registerPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="registerPassword" placeholder="••••••••" required>
                    <button type="button" class="password-toggle-btn password-toggle" tabindex="-1">
                        <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                    </button>
                    <div class="form-error"></div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                </div>
                
                <div class="col-md-6 mb-2 position-relative">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                    <button type="button" class="password-toggle-btn password-toggle" tabindex="-1">
                        <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
                    </button>
                    <div class="form-error"></div>
                </div>

                <div class="col-12 mt-3 mb-1">
                    <h6 class="text-primary fw-bold mb-2 border-bottom pb-2" style="font-family: 'Outfit', sans-serif;">Academic Interests (Optional)</h6>
                </div>

                <div class="col-md-6 mb-2">
                    <label for="course" class="form-label">Preferred Course</label>
                    <select class="form-select" id="course">
                        <option value="">Select a course</option>
                        <option value="MCA">MCA</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="MBA">MBA</option>
                        <option value="BCA">BCA</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="location" class="form-label">Preferred Location</label>
                    <select class="form-select" id="location">
                        <option value="">Select a location</option>
                        <option value="Delhi">Delhi NCR</option>
                        <option value="Punjab">Punjab</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Rajasthan">Rajasthan</option>
                    </select>
                </div>
            </div>
            
            <div class="form-check d-flex gap-2 mb-4">
                <input class="form-check-input mt-1" type="checkbox" id="terms" required>
                <label class="form-check-label text-muted small" for="terms">
                    I agree to the <a href="#" class="text-primary text-decoration-none">Terms & Conditions</a> and <a href="#" class="text-primary text-decoration-none">Privacy Policy</a>
                </label>
            </div>
            
            <button type="submit" class="btn btn-register mb-4">Create Account</button>
            
            <div class="text-center text-muted small">
                Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login</a>
            </div>
            
        </form>
        
    </div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
    <script src="js/auth.js"></script>
</body>
</html>
