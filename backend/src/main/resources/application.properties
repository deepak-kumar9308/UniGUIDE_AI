# Server configuration
server.port=8080

# Database Configuration (MySQL)
# Update these credentials to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/uniguide_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

# Hibernate / JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration (Set via environment variable in production)
jwt.secret=${JWT_SECRET:change_this_to_a_secure_random_hex_string}
jwt.expiration=86400000

# AI Services configuration
# Python service base URL
ai.service.url=http://localhost:8000
# Gemini API Key (Pass as environment variable)
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key_here}
